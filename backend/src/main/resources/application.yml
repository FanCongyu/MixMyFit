spring:
  application:
    name: mixmyfit
  jpa:
    open-in-view: false

server:
  port: ${PORT:8080}

mixmyfit:
  auth:
    cookie-same-site: ${MIXMYFIT_AUTH_COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${MIXMYFIT_CORS_ALLOWED_ORIGINS:}

management:
  endpoints:
    web:
      exposure:
        include: health
